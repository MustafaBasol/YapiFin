name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yapifin
          POSTGRES_USER: yapifin
          POSTGRES_PASSWORD: yapifin_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yapifin -d yapifin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://yapifin:yapifin_dev_password@localhost:5432/yapifin?schema=public
      AUTH_SECRET: ci-secret-not-for-production-0000000000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TRUSTED_PROXY_COUNT: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm run test

      - name: Redis rate limit integration testleri
        run: npm run test:redis-integration
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: npm run build
