services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yapifin
      POSTGRES_USER: yapifin
      POSTGRES_PASSWORD: yapifin_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yapifin -d yapifin"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Yerel geliştirme için dağıtık rate limiting (YF-509). `npm run dev`
  # REDIS_URL tanımsızken de çalışır (rate limiter süreç-içi yedek moda
  # düşer, bkz. lib/rate-limit/policy.ts) — bu servis, çoklu-instance
  # davranışını yerelde gözlemlemek isteyenler için isteğe bağlıdır.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
